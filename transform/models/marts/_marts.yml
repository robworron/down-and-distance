version: 2

models:
  - name: games
    description: One row per game since 1999 with every game-level situation bucketed. Weather is NULL unless the game was played in the open.
    columns:
      - name: game_id
        data_tests: [unique, not_null]
      - name: home_team
        data_tests: [not_null]
      - name: away_team
        data_tests: [not_null]
      - name: is_open_air
        data_tests: [not_null]
      - name: is_neutral_site
        data_tests: [not_null]
      - name: roof_type
        data_tests:
          - accepted_values:
              arguments:
                values: [outdoors, dome, retractable_open, retractable_closed]
      - name: surface_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [grass, turf]
      - name: temperature_bucket
        data_tests:
          - accepted_values:
              arguments:
                values: [32_or_below, 33_to_50, 51_to_79, 80_or_above]
      - name: wind_bucket
        data_tests:
          - accepted_values:
              arguments:
                values: [under_10, 10_to_14, 15_plus]
      - name: precipitation_bucket
        data_tests:
          - accepted_values:
              arguments:
                values: [none, light_rain, heavy_rain, snow]
      - name: time_slot
        data_tests:
          - accepted_values:
              arguments:
                values: [tnf, sunday_early, sunday_late, snf, mnf, saturday, other]
      - name: opponent_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [divisional, conference, non_conference]

  - name: team_games
    description: Two rows per game since 1999, one per team, with team-level fields (points, result, rest, spread from the team's side) and every game-level situation.
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, team]
    columns:
      - name: game_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('games')
                field: game_id
      - name: team
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_teams')
                field: team_abbr
      - name: opponent
        data_tests: [not_null]
      - name: is_home
        data_tests: [not_null]
      - name: venue
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [home, away, neutral]
      - name: result
        data_tests:
          - accepted_values:
              arguments:
                values: [win, loss, tie]
      - name: rest_bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [short, normal, extra, bye]
      - name: spread_role
        data_tests:
          - accepted_values:
              arguments:
                values: [big_favourite, favourite, pickem, underdog, big_underdog]
