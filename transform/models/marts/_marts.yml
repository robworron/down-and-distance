version: 2

seeds:
  - name: situations
    description: The situation registry (step 2.10), one row per situation the site can filter on. The website builds its filters from it and the split marts generate their SQL from it. level is game (same for both teams) or team (can differ).
    columns:
      - name: key
        data_tests: [unique, not_null]
      - name: label
        data_tests: [not_null]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [venue, stadium, weather, schedule, travel, matchup]
      - name: level
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [game, team]
      - name: column_name
        data_tests: [unique, not_null]
      - name: value_list
        data_tests: [not_null]
      - name: in_v1
        data_tests: [not_null]

models:
  - name: games
    description: One row per game since 1999 with every game-level situation bucketed. Weather is NULL unless the game was played in the open.
    columns:
      - name: game_id
        data_tests: [unique, not_null]
      - name: home_team
        data_tests: [not_null]
      - name: away_team
        data_tests: [not_null]
      - name: is_open_air
        data_tests: [not_null]
      - name: is_neutral_site
        data_tests: [not_null]
      - name: roof_type
        data_tests:
          - accepted_values:
              arguments:
                values: [outdoors, dome, retractable_open, retractable_closed]
      - name: surface_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [grass, turf]
      - name: temperature_bucket
        data_tests:
          - accepted_values:
              arguments:
                values: [32_or_below, 33_to_50, 51_to_79, 80_or_above]
      - name: wind_bucket
        data_tests:
          - accepted_values:
              arguments:
                values: [under_10, 10_to_14, 15_plus]
      - name: precipitation_bucket
        data_tests:
          - accepted_values:
              arguments:
                values: [none, light_rain, heavy_rain, snow]
      - name: time_slot
        data_tests:
          - accepted_values:
              arguments:
                values: [tnf, sunday_early, sunday_late, snf, mnf, saturday, other]
      - name: opponent_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [divisional, conference, non_conference]

  - name: team_seasons
    description: One row per team per season with the stadium it called home (most non-neutral home games that season). team_games measures travel from it.
    data_tests:
      - unique_combination:
          arguments:
            columns: [team, season]
    columns:
      - name: team
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_teams')
                field: team_abbr
      - name: season
        data_tests: [not_null]
      - name: home_stadium_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stadiums')
                field: stadium_id
      - name: home_timezone
        data_tests: [not_null]

  - name: team_game_stats
    description: One row per team per game since 2016 from play-by-play, offense and defense (the opponent's offense), as sums and counts only. Box-score stats follow official rules; EPA and success use real plays (no kneels or spikes).
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, team]
    columns:
      - name: game_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('games')
                field: game_id
      - name: team
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_teams')
                field: team_abbr
      - name: opponent
        data_tests: [not_null]
      - name: plays
        data_tests: [not_null]
      - name: epa
        data_tests: [not_null]
      - name: turnovers
        data_tests: [not_null]
      - name: def_plays
        data_tests: [not_null]

  - name: team_games
    description: Two rows per game since 1999, one per team, with team-level fields (points, result, rest, spread from the team's side, travel and body clock), every game-level situation, and play-by-play stats from 2016.
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, team]
    columns:
      - name: game_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('games')
                field: game_id
      - name: team
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_teams')
                field: team_abbr
      - name: opponent
        data_tests: [not_null]
      - name: season_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [REG, POST]
      - name: is_home
        data_tests: [not_null]
      - name: venue
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [home, away, neutral]
      - name: result
        data_tests:
          - accepted_values:
              arguments:
                values: [win, loss, tie]
      - name: rest_bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [short, normal, extra, bye]
      - name: spread_role
        data_tests:
          - accepted_values:
              arguments:
                values: [big_favourite, favourite, pickem, underdog, big_underdog]
      - name: ats_result
        data_tests:
          - accepted_values:
              arguments:
                values: [cover, push, no_cover]
      - name: total_result
        data_tests:
          - accepted_values:
              arguments:
                values: [over, under, push]
      - name: home_stadium_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stadiums')
                field: stadium_id
      - name: travel_miles
        data_tests: [not_null]
      - name: time_zone_shift
        data_tests: [not_null]
      - name: time_zone_travel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [none, eastbound_1_3, westbound_1_3, long_haul_4_plus]
      - name: body_clock
        data_tests:
          - accepted_values:
              arguments:
                values: [morning, afternoon, late_afternoon, night]
      - name: game_number
        data_tests: [not_null]
      - name: prev_result
        data_tests:
          - accepted_values:
              arguments:
                values: [win, loss, tie]
      - name: games_since_bye
        data_tests: [not_null]
      - name: consecutive_road_games
        data_tests: [not_null]

  - name: mart_team_splits
    description: A team's record in every situation value, per season and season type (REG or POST), from finished games. Generated from the situation registry. Sums and counts only, so any season range re-aggregates correctly.
    data_tests:
      - unique_combination:
          arguments:
            columns: [team, season, season_type, situation_key, situation_value]
    columns:
      - name: team
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_teams')
                field: team_abbr
      - name: season
        data_tests: [not_null]
      - name: season_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [REG, POST]
      - name: situation_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('situations')
                field: key
      - name: situation_level
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [game, team]
      - name: situation_value
        data_tests: [not_null]
      - name: games
        data_tests: [not_null]

  - name: mart_league_splits
    description: The whole league's record in every situation value, per season and season type; mart_team_splits summed over teams. games counts team-games, so win % is meaningful only for team-level situations.
    data_tests:
      - unique_combination:
          arguments:
            columns: [season, season_type, situation_key, situation_value]
    columns:
      - name: season
        data_tests: [not_null]
      - name: season_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [REG, POST]
      - name: situation_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('situations')
                field: key
      - name: situation_level
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [game, team]
      - name: situation_value
        data_tests: [not_null]
      - name: games
        data_tests: [not_null]
