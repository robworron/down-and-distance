# dbt project for Down & Distance. Run it through the pipeline wrapper, which
# turns DATABASE_URL into the DBT_* variables profiles.yml reads:
#   uv run python -m pipeline dbt build
name: down_and_distance
version: "1.0.0"
profile: down_and_distance

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "logs"]

flags:
  send_anonymous_usage_stats: false

models:
  down_and_distance:
    # Staging: one cleaned view per raw table. Views store nothing and always
    # show the current raw data.
    staging:
      +schema: staging
      +materialized: view
    # Marts: tables the website reads. Built once per run, fast to query.
    marts:
      +schema: marts
      +materialized: table

seeds:
  down_and_distance:
    # Hand-made reference CSVs, loaded by `dbt seed` into staging beside the
    # staging views, so the database keeps its three schemas.
    +schema: staging
    stadiums:
      +column_types:
        stadium_id: text
        latitude: double precision
        longitude: double precision
        altitude_m: integer
    team_code_map:
      +column_types:
        old_code: text
        current_code: text
    situations:
      # The situation registry (step 2.10). The website builds its filters
      # from it, so it lives in marts beside the tables the site reads.
      +schema: marts
      +column_types:
        in_v1: boolean
    schedule_corrections:
      # All text: "21:00" must stay a string, and a blank corrected_value loads
      # as NULL (meaning "unknown").
      +column_types:
        game_id: text
        column_name: text
        nflverse_value: text
        corrected_value: text
        note: text
