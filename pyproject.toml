[project]
name = "down-and-distance"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "nflreadpy>=0.1.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "timezonefinder>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["."]
markers = ["local_only: creates and drops tables, so runs only against the local database"]
